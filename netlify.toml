[build]
  # Clears Vite/Astro cache before each Netlify deploy to prevent stale build artifacts
  command = "rm -rf node_modules/.cache .astro && npm run build"
  publish = "dist"          # Directory to publish (output folder)
  functions = "netlify/functions"

[dev]
  framework = "astro"
  targetPort = 4321

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  function = "block-bots"
  path = "/*"

[[redirects]]
  from = '/api/*'
  to = '/.netlify/functions/:splat'
  status = 200
